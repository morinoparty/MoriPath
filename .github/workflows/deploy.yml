# TanStack Start アプリ (app/) を cf でビルドし、Worker "moripath" として deploy する。
#
# PR・main への push・手動実行で check / typecheck / build / dry-run を行い、
# main への push のときだけ本番 deploy する。
# PR では Cloudflare の Preview (pr-<番号>) に deploy し、
# PR (最新の commit) と deploy 固定の 2 つの URL を PR にコメントする。
# Version URL と違い、Preview は Workers Logs にログが残る。
# 必要な secret:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID … cf CLI 用 (Worker には渡さない)
#   AUTH_SECRET, SERVER_URL, MC_API_URL, MC_ASSETS_URL,
#   WORLD_MAP_URL, DIARY_API_URL,
#   DIARY_SHARED_KEY                            … Worker secret (本番は --secrets-file、Preview は Base 設定で渡す)
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 本番 deploy (main への push) は固定のグループで直列化する。
  # PR / 手動実行は本番に deploy しないので ref ごとに分け、本番の待ち行列を押し出さない
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  # PR に preview の URL をコメントする
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    defaults:
      run:
        # bash を明示すると -eo pipefail で実行される
        shell: bash
    steps:
      # PR では merge commit ではなく head commit をビルドし、commit 固定の preview と中身を一致させる
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # Vite Task の結果を run をまたいで再利用する。install が node_modules を作り直すので install 後に戻す。
      # 入力の変化は Vite Task が判定するため、key には run ごとの値だけを入れて最新のものを戻す
      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Check
        run: vp run check:ci

      - name: Typecheck
        run: vp run typecheck

      # app の /storybook に同梱するため先にビルドする。
      # build:storybook は vite.config.ts の build-storybook タスク (既定でキャッシュ対象) を実行し、
      # 入力が変わっていなければ前回の storybook-static を戻す
      - name: Build Storybook
        run: vp run build:storybook

      # 後続の deploy が失敗してもキャッシュを残せるよう、ビルド直後に保存する
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      # cf build は workspace の lockfile を見つけられず npx vp build に委ねるだけなので、直接ビルドする。
      # 設定の変換・検証は次の dry-run で行われる。
      # --mode は付けない。vite build が build output に mode "production" を記録するので、
      # 後続の --prebuilt --mode production と一致する
      - name: Build
        working-directory: app
        run: vp build

      - name: Dry run
        working-directory: app
        run: vp exec cf deploy --prebuilt --mode production --dry-run

      # PR の preview。本番には deploy せず、Cloudflare の Preview (pr-<番号>) に deploy する。
      # Version URL (versions create --preview-alias) は Workers Logs にログが残らないため、Preview を使う。
      # Preview は本番の設定を引き継がないので、observability は cloudflare.config.ts の値がそのまま Preview にも付く。
      # fork と Dependabot の PR には repository secrets が渡されないのでスキップする
      - if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        id: preview
        name: Deploy preview
        working-directory: app
        run: |
          # 古い run の再実行で Preview を古いコードに戻さないよう、PR の head が進んでいたら deploy しない
          current_head="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::notice::PR の head が ${current_head::8} に進んでいるため、${HEAD_SHA::8} の preview は deploy しません"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short_sha="${HEAD_SHA::8}"
          preview_name="pr-${PR_NUMBER}"

          # Preview には --secrets-file を渡せない。新しい Preview は作られたときに
          # Previews Base 設定の secret を受け取るため、本番と同じ値を Base 設定に入れておく。
          # 既にある Preview の次の deploy は、前の deploy の secret を引き継ぐ
          # 空の secret を入れないよう、揃っていなければ止める
          : "${AUTH_SECRET:?}" "${SERVER_URL:?}" "${MC_API_URL:?}" "${MC_ASSETS_URL:?}" "${WORLD_MAP_URL:?}" \
            "${DIARY_API_URL:?}" "${DIARY_SHARED_KEY:?}"
          base_config_body="$RUNNER_TEMP/previews-base-config.json"
          base_config_result="$RUNNER_TEMP/previews-base-config-result.json"
          # 失敗しても secret を含むファイルを残さない
          trap 'rm -f "$base_config_body" "$base_config_result"' EXIT
          jq -n \
            --arg AUTH_SECRET "$AUTH_SECRET" \
            --arg SERVER_URL "$SERVER_URL" \
            --arg MC_API_URL "$MC_API_URL" \
            --arg MC_ASSETS_URL "$MC_ASSETS_URL" \
            --arg WORLD_MAP_URL "$WORLD_MAP_URL" \
            --arg DIARY_API_URL "$DIARY_API_URL" \
            --arg DIARY_SHARED_KEY "$DIARY_SHARED_KEY" \
            '{previews_base_config: {env: ($ARGS.named | map_values({type: "secret_text", text: .}))}}' \
            > "$base_config_body"
          # cf に Base 設定の secret を入れるコマンドが無いため、cf が内部で使う API を直接呼ぶ (merge-patch なので他の設定は残る)
          status="$(curl -sS -o "$base_config_result" -w '%{http_code}' -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/merge-patch+json" \
            --data-binary "@${base_config_body}")"
          # 応答には設定が含まれるので、本文は出さずに成否とエラーだけを見る
          if [ "$status" != "200" ] || [ "$(jq -r '.success' "$base_config_result")" != "true" ]; then
            echo "::error::Previews Base 設定の secret を更新できませんでした (HTTP ${status})"
            jq -c '.errors // empty' "$base_config_result" || true
            exit 1
          fi

          # cf は deploy 結果を ND-JSON で WRANGLER_OUTPUT_FILE_PATH に書き出す
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/cf-output.ndjson"
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          # Preview 用の Build Output (buildContext.isPreview) が要るので、Preview としてビルドし直す
          CLOUDFLARE_PREVIEW_BUILD=true vp build
          vp exec cf previews deploy --prebuilt --mode production --preview-name "$preview_name"
          result="$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          printf '%s\n' "$result"
          deployment_id="$(jq -r '.deployment_id // empty' <<<"$result")"
          # URL は 2 つ得られる。
          #   Preview (pr-<番号>)   … その PR の最新の deploy を指し続ける
          #   Deployment (<ID>)    … この commit の deploy に固定される
          pr_url="$(jq -r '.preview_urls[0] // empty' <<<"$result")"
          deployment_url="$(jq -r '.deployment_urls[0] // empty' <<<"$result")"
          if [ -z "$deployment_id" ]; then
            echo "::error::cf の出力から Preview の deployment ID を取得できませんでした"
            exit 1
          fi
          if [ -z "$pr_url" ] || [ -z "$deployment_url" ]; then
            echo "::warning::cf の出力に Preview の URL がありません"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "deployment_id=${deployment_id}"
            echo "pr_url=${pr_url}"
            echo "deployment_url=${deployment_url}"
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: moripath
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MC_API_URL: ${{ secrets.MC_API_URL }}
          MC_ASSETS_URL: ${{ secrets.MC_ASSETS_URL }}
          WORLD_MAP_URL: ${{ secrets.WORLD_MAP_URL }}
          DIARY_API_URL: ${{ secrets.DIARY_API_URL }}
          DIARY_SHARED_KEY: ${{ secrets.DIARY_SHARED_KEY }}

      # push のたびにコメントを増やさないよう、前回のコメントを書き換える。
      # 同じ表を Job Summary にも残し、commit ごとの URL を run から辿れるようにする
      - if: steps.preview.outcome == 'success' && steps.preview.outputs.stale != 'true'
        name: Comment preview URL
        run: |
          comment="$RUNNER_TEMP/preview-comment.md"
          {
            echo "## 🚀 Preview of ${REPO_NAME}"
            echo
            echo "| Resource | Link |"
            echo "|----------|------|"
            if [ -n "$PR_URL" ]; then
              echo "| 🌐 PR #${PR_NUMBER} (latest) | ${PR_URL} |"
              echo "| 📚 Storybook (latest) | ${PR_URL}/storybook/ |"
            fi
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "| 📌 Commit \`${SHORT_SHA}\` | ${DEPLOYMENT_URL} |"
              echo "| 📚 Storybook (\`${SHORT_SHA}\`) | ${DEPLOYMENT_URL}/storybook/ |"
            fi
            echo "| 🧩 Preview deployment | \`${DEPLOYMENT_ID}\` |"
            echo "| 🔖 Head commit | [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${HEAD_SHA}) |"
            echo
            echo "> [!NOTE]"
            echo "> preview は本番と同じ値の Worker secret を使います。"
            echo "> MineAuth の OAuth redirect URI (\`<origin>/api/auth/callback/MineAuth\`) は preview の origin では登録されていないため、サインインに失敗することがあります。"
          } > "$comment"
          cat "$comment" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file "$comment" --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHORT_SHA: ${{ steps.preview.outputs.short_sha }}
          DEPLOYMENT_ID: ${{ steps.preview.outputs.deployment_id }}
          PR_URL: ${{ steps.preview.outputs.pr_url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment_url }}

      # 本番 deploy は main への push のときだけ
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Deploy to Cloudflare
        working-directory: app
        run: |
          # 空の secret で上書きしないよう、揃っていなければ止める
          : "${AUTH_SECRET:?}" "${SERVER_URL:?}" "${MC_API_URL:?}" "${MC_ASSETS_URL:?}" "${WORLD_MAP_URL:?}" \
            "${DIARY_API_URL:?}" "${DIARY_SHARED_KEY:?}"
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          # 失敗しても secret のファイルを残さない
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg AUTH_SECRET "$AUTH_SECRET" \
            --arg SERVER_URL "$SERVER_URL" \
            --arg MC_API_URL "$MC_API_URL" \
            --arg MC_ASSETS_URL "$MC_ASSETS_URL" \
            --arg WORLD_MAP_URL "$WORLD_MAP_URL" \
            --arg DIARY_API_URL "$DIARY_API_URL" \
            --arg DIARY_SHARED_KEY "$DIARY_SHARED_KEY" \
            '$ARGS.named' > "$secrets_file"
          vp exec cf deploy --prebuilt --mode production --secrets-file "$secrets_file" \
            --message "Deployed by GitHub Actions ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MC_API_URL: ${{ secrets.MC_API_URL }}
          MC_ASSETS_URL: ${{ secrets.MC_ASSETS_URL }}
          WORLD_MAP_URL: ${{ secrets.WORLD_MAP_URL }}
          DIARY_API_URL: ${{ secrets.DIARY_API_URL }}
          DIARY_SHARED_KEY: ${{ secrets.DIARY_SHARED_KEY }}
