name: Preview

on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"

    name: Deploy
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false   # Install ステップで --frozen-lockfile 付きで行う

      - name: Install
        run: pnpm install --frozen-lockfile

      # app の /storybook に同梱するため先にビルドする
      - name: Build Storybook
        run: pnpm run build:storybook

      # `cf previews deploy` は自前でビルドするため --prebuilt は付けない
      # --secrets-file を受け付けないため secret は渡せない
      - name: Deploy preview
        id: upload-preview
        working-directory: app
        # pipefail で tee の前の cf の失敗を拾う
        shell: bash
        run: |
          pnpm exec cf previews deploy "pr-${{ github.event.number }}" | tee "$RUNNER_TEMP/preview.json"
          # 出力から preview URL を取り出す
          url=$(jq -r '[(.preview_urls, .deployment_urls) | .. | strings | select(startswith("https://"))][0] // empty' "$RUNNER_TEMP/preview.json" 2>/dev/null || true)
          url=${url:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/preview.json" | head -1)}
          test -n "$url"
          echo "deployment-url=${url%/}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create comment file
        id: create-comment-file
        env:
          DEPLOYMENT_URL: ${{ steps.upload-preview.outputs.deployment-url }}
        run: |
          cat  << EOF > comment.md
          ## 🚀 Deploying ${{ github.event.repository.name }} with Cloudflare Workers
          <table>
            <tr>
              <th scope="row">Preview URL</th>
              <td><a href="$DEPLOYMENT_URL">$DEPLOYMENT_URL</a></td>
            </tr>
            <tr>
              <th scope="row">Storybook URL</th>
              <td><a href="$DEPLOYMENT_URL/storybook/">$DEPLOYMENT_URL/storybook/</a></td>
            </tr>
          </table>
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
