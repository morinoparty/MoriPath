name: Preview

on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  deploy:
    # アプリの secret はリポジトリの Actions secrets に置き、--secrets-file でアップロードする
    env:
      MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      SERVERS: ${{ secrets.SERVERS }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
    timeout-minutes: 10

    name: Deploy
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

        # Node.jsのインストール
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証
      - name: Setup npm auth for GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install

      # Storybook を先にビルドし、app の client アセット (/storybook) に同梱する
      - name: Build
        run: pnpm run build

      # 本番 worker (moripath) の未昇格バージョンとしてアップロードし、preview URL を得る
      - name: Upload preview version
        id: upload-preview
        working-directory: app
        # pipefail を有効にして tee の前の cf の失敗を拾う
        shell: bash
        run: |
          jq -n --arg AUTH_SECRET "$AUTH_SECRET" --arg MAIN_SERVER_URL "$MAIN_SERVER_URL" --arg SERVER_URL "$SERVER_URL" --arg SERVERS "$SERVERS" '$ARGS.named' > "$RUNNER_TEMP/secrets.json"
          pnpm exec cf workers versions create --prebuilt \
            --secrets-file "$RUNNER_TEMP/secrets.json" \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "Deployed by GitHub Actions branch ${{ github.head_ref }}" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          rm -f "$RUNNER_TEMP/secrets.json"
          # PR ごとに固定のエイリアス URL を優先し、無ければバージョンの preview URL を使う
          url=$(grep -oE 'https://pr-${{ github.event.number }}-[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | head -1)
          url=${url:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | head -1)}
          test -n "$url"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
        # morino.party を持つ OWNER の Cloudflare アカウントにデプロイする (org secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OWNER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OWNER_CLOUDFLARE_ACCOUNT_ID }}

      - name: Create comment file
        id: create-comment-file
        env:
          DEPLOYMENT_URL: ${{ steps.upload-preview.outputs.deployment-url }}
        run: |
          cat  << EOF > comment.md
          ## 🚀 Deploying ${{ github.event.repository.name }} with Cloudflare Workers
          <table>
            <tr>
              <th scope="row">Preview URL</th>
              <td><a href="$DEPLOYMENT_URL">$DEPLOYMENT_URL</a></td>
            </tr>
            <tr>
              <th scope="row">Storybook URL</th>
              <td><a href="$DEPLOYMENT_URL/storybook/">$DEPLOYMENT_URL/storybook/</a></td>
            </tr>
          </table>
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
