name: Preview

on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  deploy:
    # AUTH_SECRET は Cloudflare Secrets Store バインディング (BSM: shared/AUTH_SECRET) から
    # Worker 実行時に供給されるため、ここでの取得は不要。
    env:
      MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      SERVERS: ${{ secrets.SERVERS }}

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    timeout-minutes: 10

    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

        # Node.jsのインストール
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証
      - name: Setup npm auth for GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install

      - name: Build pages
        run: pnpm run build:all
        
      # デプロイトークンは BSM morinoparty プロジェクトの shared/CLOUDFLARE_API_TOKEN から取得
      # (Secrets Store バインディング付きデプロイには Secrets Store Edit 権限が必要なため)
      - name: Get deploy token from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            d1a5c5d9-41cc-48f0-9035-b49901583491 > CLOUDFLARE_API_TOKEN

      # sm-action は env にしか出さないため、wrangler-action の with: から参照できるよう output 化
      - name: Expose deploy token as step output
        id: bws-deploy
        run: echo "cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy pages preview
        id: deploy-pages-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: app
          # 本番 worker (moripath) の未昇格バージョンとしてアップロードし、preview URL を得る
          command: versions upload --message "Deployed pages by GitHub Actions branch ${{ github.ref_name }}"
      
      - name: Deploy storybook preview
        id: deploy-storybook-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: storybook
          command: versions upload --message "Deployed storybook by GitHub Actions branch ${{ github.ref_name }}"
          
      - name: Create comment file
        id: create-comment-file
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-pages-preview.outputs.deployment-url }}
          STORYBOOK_URL: ${{ steps.deploy-storybook-preview.outputs.deployment-url }}
        run: |
          cat  << EOF > comment.md
          ## 🚀 Deploying ${{ github.event.repository.name }} with Cloudflare Workers
          <table>
            <tr>
              <th scope="row">Preview URL</th>
              <td><a href="$DEPLOYMENT_URL">$DEPLOYMENT_URL</a></td>
            </tr>
            <tr>
              <th scope="row">Storybook URL</th>
              <td><a href="$STORYBOOK_URL">$STORYBOOK_URL</a></td>
            </tr>
          </table>
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}