name: Preview

on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"

    name: Deploy
    steps:
      - uses: actions/checkout@v7

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # GitHub Packages の認証を install 前に挟むため

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証
      - name: Setup npm auth for GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Storybook を先にビルドし、app の client アセット (/storybook) に同梱する
      - name: Build Storybook
        run: pnpm run build:storybook

      # Worker "moripath" の Worker Preview として deploy する。
      # `cf previews deploy` は isPreview でビルドし直すので --prebuilt は付けない。
      # `cf previews deploy` は --secrets-file を受け付けない。Preview が本番 Worker に
      # 登録済みの secret (AUTH_SECRET, SERVER_URL) を使えるかは未確認。
      - name: Deploy preview
        id: upload-preview
        working-directory: app
        # pipefail を有効にして tee の前の cf の失敗を拾う
        shell: bash
        run: |
          pnpm exec cf previews deploy "pr-${{ github.event.number }}" | tee "$RUNNER_TEMP/preview.json"
          # 出力 JSON の preview_urls (無ければ deployment_urls) から URL を取り、
          # JSON として読めなければ出力中の workers.dev URL を使う
          url=$(jq -r '[(.preview_urls, .deployment_urls) | .. | strings | select(startswith("https://"))][0] // empty' "$RUNNER_TEMP/preview.json" 2>/dev/null || true)
          url=${url:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/preview.json" | head -1)}
          test -n "$url"
          echo "deployment-url=${url%/}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create comment file
        id: create-comment-file
        env:
          DEPLOYMENT_URL: ${{ steps.upload-preview.outputs.deployment-url }}
        run: |
          cat  << EOF > comment.md
          ## 🚀 Deploying ${{ github.event.repository.name }} with Cloudflare Workers
          <table>
            <tr>
              <th scope="row">Preview URL</th>
              <td><a href="$DEPLOYMENT_URL">$DEPLOYMENT_URL</a></td>
            </tr>
            <tr>
              <th scope="row">Storybook URL</th>
              <td><a href="$DEPLOYMENT_URL/storybook/">$DEPLOYMENT_URL/storybook/</a></td>
            </tr>
          </table>
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
