name: Deploy

# 本番 deploy は main への push のみ。手動実行は dry-run まで
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false   # Install ステップで --frozen-lockfile 付きで行う

      - name: Install
        run: pnpm install --frozen-lockfile

      # app の /storybook に同梱するため先にビルドする
      - name: Build Storybook
        run: pnpm run build:storybook

      - name: Build
        working-directory: app
        run: pnpm exec cf build

      - name: Dry run
        working-directory: app
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app
        run: |
          # 空の secret で上書きしないよう、揃っていなければ止める
          : "${AUTH_SECRET:?}" "${SERVER_URL:?}" "${MC_API_URL:?}"
          jq -n --arg AUTH_SECRET "$AUTH_SECRET" --arg SERVER_URL "$SERVER_URL" --arg MC_API_URL "$MC_API_URL" '$ARGS.named' > "$RUNNER_TEMP/secrets.json"
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/secrets.json" --message "Deployed by GitHub Actions ${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MC_API_URL: ${{ secrets.MC_API_URL }}
