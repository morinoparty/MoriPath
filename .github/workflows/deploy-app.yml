name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # アプリの secret はリポジトリの Actions secrets に置き、--secrets-file でアップロードする
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SERVER_URL: ${{ secrets.SERVER_URL }}

    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証
      - name: Setup npm auth for GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: |
          pnpm install

      # Storybook を先にビルドし、app の client アセット (/storybook) に同梱する
      - name: Build
        run: |
          pnpm run build

      # secrets は `--secrets-file` でバージョンと同時にアップロードする。
      # (デプロイ前に secret を個別更新すると、preview.yml の未デプロイバージョンが
      #  存在する場合に Cloudflare API がエラー 10214 を返すため)
      - name: Deploy
        working-directory: app
        run: |
          jq -n --arg AUTH_SECRET "$AUTH_SECRET" --arg SERVER_URL "$SERVER_URL" '$ARGS.named' > "$RUNNER_TEMP/secrets.json"
          pnpm exec cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/secrets.json" --message "Deployed by GitHub Actions ${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_KEY }}
