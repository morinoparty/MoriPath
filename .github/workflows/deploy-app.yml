name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    env:
      MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      SERVERS: ${{ secrets.SERVERS }}
      REDIRECT_AUTH_URL: ${{ secrets.REDIRECT_AUTH_URL }}

    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証
      - name: Setup npm auth for GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: |
          pnpm install

      - name: Build
        run: |
          pnpm run build

      # AUTH_SECRET は Cloudflare Secrets Store バインディング (BSM: shared/AUTH_SECRET) から
      # Worker 実行時に供給されるため、ここでの取得・wrangler secret put は不要。
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_KEY }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          environment: production
          secrets: |
            MAIN_SERVER_URL
            SERVER_URL
            SERVERS
            REDIRECT_AUTH_URL
        env:
          MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SERVERS: ${{ secrets.SERVERS }}
          REDIRECT_AUTH_URL: ${{ secrets.REDIRECT_AUTH_URL }}
